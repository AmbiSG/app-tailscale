---
name: "Ambi Support Tailscale"
version: dev
slug: ambi_support_tailscale
description: "Ephemeral, on-demand Tailscale node for Ambi remote support"
url: https://github.com/AmbiSG/app-tailscale
ingress: false
startup: manual
panel_icon: mdi:lifebuoy
arch:
  - amd64
init: false
hassio_api: true
host_network: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
devices:
  - /dev/net/tun
map:
  - type: local_apps
    read_only: false
  - type: all_app_configs
    read_only: false
  - type: backup
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: false
ports:
  41642/udp: null
options:
  accept_dns: false
  accept_routes: false
  advertise_connector: false
  advertise_exit_node: false
  advertise_routes: []
  advertise_tags:
    - "tag:ambi-support"
  always_use_derp: false
  auth_key: ""
  force_reauth: false
  log_level: info
  log_upload: false
  login_server: "https://headscale.ambi.sg"
  services: []
  snat_subnet_routes: true
  stateful_filtering: false
  taildrive:
    local_apps: false
    app_configs: false
    backup: false
    config: false
    media: false
    share: false
    ssl: false
  taildrop: false
  userspace_networking: false
schema:
  accept_dns: bool
  accept_routes: bool
  advertise_connector: bool
  advertise_exit_node: bool
  advertise_routes:
    - "match(^(?:local_subnets|(?:(?:25[0-5]|(?:2[0-4]|1\\d|[1-9]?)\\d)\\.){3}(?:25[0-5]|(?:2[0-4]|1\\d|[1-9]?)\\d)\\/(?:3[0-2]|[12]?\\d)|[a-fA-F\\d.:]+:[a-fA-F\\d.:]+\\/(?:12[0-8]|(?:1[01]|[1-9]?)\\d))$)"
  advertise_tags:
    - "match(^tag:[a-zA-Z][a-zA-Z0-9-]*$)"
  always_use_derp: bool
  auth_key: "match(^[a-zA-Z0-9]*$)?"
  exit_node: "match(^(?:(?:(?:25[0-5]|(?:2[0-4]|1\\d|[1-9]?)\\d)\\.){3}(?:25[0-5]|(?:2[0-4]|1\\d|[1-9]?)\\d)|[a-fA-F\\d.:]+:[a-fA-F\\d.:]+|[a-fA-F\\d]{8}(?:-[a-fA-F\\d]{4}){3}-[a-fA-F\\d]{12}|auto:any)$)?"
  force_reauth: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  log_upload: bool
  login_server: url
  services:
    - name: "match(^svc:[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$)"
      target: "match(^(?:https?|tcp)://127\\.0\\.0\\.1:([1-9]\\d{0,3}|[1-5]\\d{4}|6[0-4]\\d{3}|65[0-4]\\d{2}|655[0-2]\\d|6553[0-5])$)"
      protocol: "list(http|https|tcp|tls-terminated-tcp)"
      port: port
      path: "match(^/.*$)?"
  snat_subnet_routes: bool
  stateful_filtering: bool
  taildrive:
    local_apps: bool
    app_configs: bool
    backup: bool
    config: bool
    media: bool
    share: bool
    ssl: bool
  taildrop: bool
  userspace_networking: bool
