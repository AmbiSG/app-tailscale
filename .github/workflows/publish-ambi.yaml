---
name: Publish Ambi app

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push and sign images and publish the manifest
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./tailscale

      - name: Normalize image information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          name=${{ steps.info.outputs.name }}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          description=${{ steps.info.outputs.description }}
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          url=${{ steps.info.outputs.url }}
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read upstream base image
        id: base
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python3 -m venv "$RUNNER_TEMP/base-image-venv"
          "$RUNNER_TEMP/base-image-venv/bin/pip" install PyYAML==6.0.2
          "$RUNNER_TEMP/base-image-venv/bin/python" - <<'PY'
          import os
          import yaml

          with open("tailscale/build.yaml", encoding="utf-8") as source:
              image = yaml.safe_load(source)["build_from"][os.environ["BUILD_ARCH"]]
          if not isinstance(image, str) or not image or any(c.isspace() for c in image):
              raise ValueError("Missing or invalid upstream base image")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image={image}\n")
          PY

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./tailscale
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ inputs.publish }}
          cosign: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    if: inputs.publish
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: ${{ needs.prepare.outputs.version }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
