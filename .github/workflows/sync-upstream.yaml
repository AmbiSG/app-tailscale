---
name: Sync upstream

# GitHub scheduled workflows can be delayed, so this is an upper-bound cadence,
# not an immediate event-driven mirror.
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_required: ${{ steps.prepare.outputs.release_required }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      updated: ${{ steps.prepare.outputs.updated }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge upstream and prepare an immutable release
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hassio-addons/app-tailscale.git
          # Keep upstream release tags separate from fork release tags.
          git fetch --no-tags upstream main '+refs/tags/v*:refs/tags/upstream/v*'
          before="$(git rev-parse HEAD)"
          git merge --no-edit upstream/main
          merged="$(git rev-parse HEAD)"
          if [[ "$before" == "$merged" ]]; then
            updated=false
            version="$(sed -n 's/^version: //p' tailscale/config.yaml)"
          else
            updated=true
            version="$(python3 scripts/reconcile_upstream.py --upstream-ref upstream/main)"
            if git show-ref --verify --quiet "refs/tags/v${version}"; then
              echo "Refusing to reuse immutable release tag v${version}" >&2
              exit 1
            fi
            git diff --check
            git add \
              FORK.md \
              tailscale/config.yaml \
              tailscale/rootfs/etc/nginx/includes/upstream.conf \
              tailscale/rootfs/etc/s6-overlay/s6-rc.d/web/run
            git diff --cached --quiet || git commit -m "Prepare automated Ambi release ${version}"
            git push origin HEAD:main
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ambi\.[0-9]+$ ]]; then
            echo "Invalid Ambi release version: $version" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            release_required=false
          else
            release_required=true
          fi

          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: sync
    if: needs.sync.outputs.release_required == 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      source_ref: ${{ needs.sync.outputs.release_sha }}
    permissions:
      contents: read

  publish:
    needs:
      - sync
      - validate
    if: needs.sync.outputs.release_required == 'true'
    uses: ./.github/workflows/publish-ambi.yaml
    with:
      publish: true
      source_ref: ${{ needs.sync.outputs.release_sha }}
    permissions:
      contents: read
      id-token: write
      packages: write

  release:
    needs:
      - sync
      - validate
      - publish
    if: needs.sync.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.sync.outputs.release_sha }}
      VERSION: ${{ needs.sync.outputs.version }}
    steps:
      - name: Create immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Ambi Support Tailscale ${VERSION}" \
            --generate-notes
