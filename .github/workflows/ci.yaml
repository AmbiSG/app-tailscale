---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The upstream community-app linter requires development branches to use
      # version "dev". This fork is itself a stable Home Assistant repository,
      # so validate it with the same metadata reader used by our publisher.
      - name: Validate Home Assistant app metadata
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./tailscale
